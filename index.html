/* ===== DATA ===== */
const RING=[
[1,"Pendahuluan & penggerak desain",["Tiga tingkat: <b>Kebutuhan</b> (apa yang diinginkan) → <b>Keputusan desain</b> (struktur & interaksi) → <b>Implementasi</b> (kode/realisasi).","Empat penggerak desain: <b>fungsi penting</b>, <b>atribut kualitas</b>, <b>kendala</b>, <b>konteks</b> (stakeholder & lingkungan).","Prinsip: abstraksi, modularitas, separation of concerns, information hiding/enkapsulasi, kohesi tinggi, coupling rendah."],"Satu fungsi yang validasi + ubah data + kirim pesan + atur tampilan = melanggar SoC dan kohesi rendah."],
[2,"Kebutuhan & skenario kualitas",["Enam unsur: <b>Sumber, Stimulus, Lingkungan, Artefak, Respons, Ukuran Respons</b>.","Batasan wajib (tak bisa ditawar) ≠ asumsi (perlu divalidasi data) ≠ preferensi (masih bisa didiskusikan).","“Cepat dan aman” itu buruk: tanpa profil beban, tanpa angka. Perbaiki jadi skenario dengan target kuantitatif.","Trade-off: keamanan vs kinerja; ketersediaan vs biaya."],"Soal sering minta menunjuk mana “Artefak” dan mana “Ukuran Respons” dari sebuah narasi."],
[3,"Alternatif arsitektur",["<b>Modular monolith</b>: satu deployment, modul terpisah logis. Transaksi lokal mudah; deploy ulang seluruh aplikasi bila ada perubahan.","<b>Services</b>: deploy terpisah via jaringan. Skala & update mandiri; latensi, kegagalan parsial, distributed transaction.","Layered: Presentasi → Aplikasi → Domain → Infrastruktur. Risiko: kebocoran dependensi.","Taktik & biayanya: cache → invalidasi rumit; replika → biaya naik; antarmuka stabil → modifiability.","Outbox + worker: reservasi sukses setelah tersimpan lokal, notifikasi diproses asinkron."],"Pilihan teknologi harus bisa ditelusuri ke penggerak desain, bukan tren."],
[4,"Notasi arsitektur & ADR",["Tiga view: <b>Konteks</b> (aktor & sistem eksternal), <b>Komponen</b> (tanggung jawab & dependensi), <b>Deployment</b> (di infrastruktur apa berjalan).","Dependency: garis putus-putus panah terbuka dari client ke supplier. Realization: garis putus-putus segitiga kosong ke interface.","Provided interface (ditawarkan), required interface (dibutuhkan), assembly connector (lollipop & socket).","ADR: <b>Konteks, Keputusan, Alternatif ditolak, Konsekuensi</b>."],"Dependensi kode ≠ aliran data runtime."],
[5,"Strategi desain & baseline",["Top-down = dekomposisi dari tujuan bisnis/skenario kualitas. Bottom-up = komposisi dari aset/teknologi yang ada. Gabungkan keduanya.","Iteratif = memperbaiki. Inkremental = menambah cakupan.","Pasangan masalah → bukti: pemahaman pengguna → uji tugas prototipe; konflik data → uji konkurensi spike; target kinerja → load test; kemudahan ubah → simulasi perubahan & review dampak.","Kontrak operasi: prasyarat, hasil sukses/gagal atomik dengan kode alasan jelas."],"Storyboard tidak cukup membuktikan target p95."],
[6,"Rancangan rinci & kontrak",["Kohesi rendah: satu kelas campur aduk (LoanManager: setujui pinjaman + hitung gaji + PDF). Coupling tinggi: baca tabel modul lain, dependensi melingkar.","SOLID: SRP, OCP, LSP, ISP, DIP (lihat tab Contekan).","Kontrak operasi: <b>signature, prasyarat, pascasyarat, invariant</b>.","Cek “if available lalu update” tidak cukup untuk konkurensi: butuh transaksi, locking, atau constraint. Retry dengan operationId sama → kembalikan hasil lama."],"LSP: subclass tidak boleh memperkuat prasyarat atau melemahkan jaminan induk."],
[7,"Kolaborasi komponen",["Sequence diagram: Controller (terima request, tanpa aturan bisnis), Service (orkestrasi), Entity (jaga aturan status sendiri), Repository (akses data).","Perubahan status + alokasi barang dalam satu transaksi; gagal sebelum commit → rollback penuh.","Notifikasi di luar transaksi utama; bila gagal setelah commit, state sah dipertahankan dan dikirim ulang asinkron.","requestId → idempotensi. Race condition: yang kalah ditolak dengan error konflik, invariant tetap aman."],"Dua petugas cek barang bersamaan sama-sama melihat “Tersedia”: if biasa tidak menolong."]
];
const FC=[
[1,"Beda Kebutuhan, Keputusan Desain, Implementasi?","Kebutuhan = apa yang diinginkan. Keputusan desain = bagaimana struktur & interaksinya. Implementasi = bagaimana kode merealisasikannya."],
[1,"Empat penggerak desain?","Fungsi penting, atribut kualitas, kendala, konteks."],
[1,"Abstraksi?","Menyembunyikan detail rumit, hanya menampilkan kontrak penting (panggil pesanSlot tanpa tahu penyimpanannya)."],
[1,"Separation of Concerns?","Memisahkan kode berdasarkan alasan perubahan berbeda: aturan bisnis, tampilan UI, pengiriman pesan."],
[1,"Information hiding & enkapsulasi?","Menyembunyikan keputusan/struktur data internal yang rawan berubah di balik interface."],
[1,"Kohesi vs coupling?","Kohesi = fokus tanggung jawab dalam satu modul (target tinggi). Coupling = kekuatan ketergantungan antar modul (target rendah)."],
[2,"Enam unsur skenario kualitas?","Sumber stimulus, stimulus, lingkungan, artefak, respons, ukuran respons."],
[2,"Batasan vs asumsi vs preferensi?","Batasan: mutlak (wajib SSO kampus). Asumsi: perkiraan yang perlu divalidasi (200 pengguna virtual). Preferensi: kecenderungan tim yang bisa didiskusikan (lebih familiar Java)."],
[2,"Kenapa “cepat dan aman” buruk?","Tidak ada parameter ukur, profil beban, atau batas latensi. Ubah jadi skenario kualitas dengan target kuantitatif."],
[2,"Contoh trade-off atribut kualitas?","Keamanan vs kinerja (enkripsi/audit sinkron menambah latensi); ketersediaan vs biaya (redundansi menaikkan biaya)."],
[3,"Modular monolith: kelebihan & kekurangan?","+ Transaksi lokal mudah, cocok tim kecil & tenggat singkat. − Perubahan kecil = deploy ulang seluruh aplikasi."],
[3,"Services: kelebihan & kekurangan?","+ Skala & update mandiri. − Latensi jaringan, kegagalan parsial, distributed transaction kompleks."],
[3,"Urutan layered architecture?","Presentasi → Aplikasi → Domain → Infrastruktur."],
[3,"Cache, replika, antarmuka stabil: konsekuensinya?","Cache → invalidasi rumit. Replika → biaya operasional naik. Antarmuka stabil → perubahan tidak merembet (modifiability)."],
[3,"Outbox pattern & worker?","Reservasi sukses setelah tersimpan di DB lokal; notifikasi masuk antrean outbox dan diproses worker asinkron, jadi SMS/email mati tidak menggagalkan reservasi."],
[4,"Tiga view arsitektur dan pertanyaannya?","Konteks: siapa aktor & sistem eksternal? Komponen: siapa bertanggung jawab & dependensinya? Deployment: berjalan di infrastruktur apa saat runtime?"],
[4,"Dependency vs realization?","Dependency: garis putus-putus, panah terbuka, client → supplier. Realization: garis putus-putus, segitiga kosong, ke interface."],
[4,"Provided vs required interface?","Provided = layanan yang ditawarkan. Required = layanan yang dibutuhkan agar bekerja. Assembly connector = lollipop & socket."],
[4,"Empat bagian ADR?","Konteks, keputusan, alternatif yang ditolak (beserta alasan), konsekuensi (positif & negatif)."],
[5,"Top-down vs bottom-up?","Top-down: dekomposisi dari tujuan bisnis/skenario kualitas ke komponen. Bottom-up: komposisi dari aset/teknologi yang sudah ada. Gabungkan dalam satu iterasi."],
[5,"Iteratif vs inkremental?","Iteratif = memperbaiki berdasarkan evaluasi. Inkremental = menambah cakupan fitur bertahap."],
[5,"Pasangan masalah → bukti validasi?","Pemahaman pengguna → uji tugas prototipe. Konflik data → uji konkurensi spike. Target kinerja → load test. Kemudahan ubah aturan → simulasi perubahan & review dampak."],
[6,"Tanda kohesi buruk & coupling buruk?","Kohesi buruk: kelas campur tanggung jawab tak relevan. Coupling buruk: baca tabel modul lain, utak-atik representasi internal, dependensi melingkar."],
[6,"SRP, OCP?","SRP: satu alasan untuk berubah. OCP: diperluas lewat interface stabil tanpa ubah kode lama (ApprovalPolicy)."],
[6,"LSP, ISP, DIP?","LSP: subclass tak memperkuat prasyarat/melemahkan jaminan. ISP: pecah interface gemuk. DIP: domain & infrastruktur sama-sama bergantung pada abstraksi."],
[6,"Empat elemen kontrak operasi?","Signature, prasyarat, pascasyarat, invariant."],
[6,"Idempoten pada retry?","Request ulang dengan operationId/requestId sama mengembalikan hasil tersimpan, tanpa data baru atau efek samping ganda."],
[7,"Peran Controller, Service, Entity, Repository?","Controller: terima request & kirim respons (tanpa aturan bisnis). Service: orkestrasi alur. Entity: data + validasi status sendiri. Repository: akses data persisten."],
[7,"Batas transaksi & rollback?","Ubah status + alokasi barang dalam satu transaksi. Gagal sebelum commit → rollback penuh, tanpa perubahan parsial."],
[7,"Notifikasi gagal setelah commit?","State bisnis tetap sah; notifikasi di luar transaksi utama, dijadwalkan ulang (retry) secara asinkron."],
[7,"Race condition dua permintaan serentak?","if-check di aplikasi tidak cukup. Pakai locking pesimistik/optimistik, constraint DB, atau atomic update; yang kalah ditolak dengan error konflik."]
];

[1,"“Menggunakan database constraint untuk mengunci slot transaksi” termasuk…","Implementasi",["Kebutuhan","Keputusan desain","Konteks"],"Realisasi teknis di level kode/database."],

[1,"Satu fungsi memvalidasi pengguna, mengubah slot, mengirim pesan, dan mengatur tampilan. Masalahnya?","Melanggar SoC dan kohesi rendah",["Coupling terlalu rendah","Melanggar LSP saja","Tidak ada masalah, justru efisien"],"Terlalu banyak tanggung jawab berbeda dalam satu fungsi."],

/* ===== LATIHAN ===== */
$("#latihan").innerHTML=`<h2>Latihan kasus</h2><p class="mute">Pilih jawaban pada tiap baris, lalu tekan “Periksa”.</p>`+DR.map((d,k)=>`<div class="card" data-k="${k}"><h3>${d.t}</h3><p class="mute">${d.d}</p>${d.i.map((it,j)=>`<div class="dr" data-j="${j}"><div class="t">${it[0]}</div><select><option value="">Pilih…</option>${d.o.map((o,n)=>`<option value="${n}">${o}</option>`).join("")}</select><div class="r hid"></div></div>`).join("")}<div class="row" style="margin-top:12px"><button class="btn" data-c="${k}">Periksa</button><span class="mute" id="sc${k}"></span></div></div>`).join("");
$("#latihan").onclick=e=>{const k=e.target.dataset.c;if(k===undefined)return;const d=DR[k];let s=0;
 document.querySelectorAll(`[data-k="${k}"] .dr`).forEach(r=>{const it=d.i[+r.dataset.j],v=r.querySelector("select").value,ok=v!==""&&+v===it[1],rs=r.querySelector(".r");
  r.classList.toggle("ok",ok);r.classList.toggle("no",!ok);rs.classList.remove("hid");rs.innerHTML=ok?`Benar. ${it[2]}`:`Jawaban: <b>${d.o[it[1]]}</b>. ${it[2]}`;if(ok)s++});
 $("#sc"+k).textContent=`Skor ${s}/${d.i.length}`}

/* ===== ESAI ===== */
$("#esai").innerHTML=`<h2>Latihan esai</h2><p class="mute">Tulis jawabanmu sendiri dulu di kertas atau kotak di bawah, baru buka kunci. Kunci hanya model jawaban, kata-katamu boleh berbeda selama intinya sama.</p>`+ESAI.map((e,i)=>`<div class="card"><h3>${i+1}. ${e[0]}</h3><textarea rows="4" style="width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit" placeholder="Tulis jawabanmu di sini (tidak disimpan)"></textarea><div class="row" style="margin-top:8px"><button class="btn g" data-e="${i}">Lihat kunci</button></div><div class="fb hid" style="background:var(--okS)" id="ek${i}">${e[1]}</div></div>`).join("");
$("#esai").onclick=e=>{const i=e.target.dataset.e;if(i!==undefined)$("#ek"+i).classList.toggle("hid")};

/* ===== CONTEKAN ===== */
$("#contekan").innerHTML=`<div class="row" style="justify-content:space-between"><h2>Contekan</h2><button class="btn g noprint" onclick="print()">Cetak</button></div>
<div class="card sc"><h3>Modular monolith vs services</h3><table><tr><th></th><th>Modular monolith</th><th>Services</th></tr><tr><td>Deployment</td><td>Satu unit</td><td>Terpisah per layanan</td></tr><tr><td>Komunikasi</td><td>Pemanggilan lokal</td><td>Jaringan (API/RPC)</td></tr><tr><td>Kelebihan</td><td>Transaksi lokal, cocok tim kecil</td><td>Skala & update mandiri</td></tr><tr><td>Kekurangan</td><td>Perubahan kecil = deploy ulang semua</td><td>Latensi, kegagalan parsial, distributed transaction</td></tr></table></div>
<div class="card sc"><h3>SOLID</h3><table><tr><th>Prinsip</th><th>Intinya</th><th>Contoh di materi</th></tr><tr><td>SRP</td><td>Satu alasan berubah</td><td>Pisahkan pengumpulan tugas dari pembuat laporan</td></tr><tr><td>OCP</td><td>Terbuka diperluas, tertutup diubah</td><td>ApprovalPolicy per fakultas</td></tr><tr><td>LSP</td><td>Pengganti tak merusak kontrak induk</td><td>Subclass tak memperkuat prasyarat</td></tr><tr><td>ISP</td><td>Interface kecil & spesifik</td><td>Pisahkan read-only laporan dari write persetujuan</td></tr><tr><td>DIP</td><td>Bergantung pada abstraksi</td><td>Domain tak bergantung ke Infrastruktur</td></tr></table></div>
<div class="card sc"><h3>Taktik dan konsekuensinya</h3><table><tr><th>Taktik</th><th>Manfaat</th><th>Biaya</th></tr><tr><td>Cache</td><td>Kinerja</td><td>Invalidasi rumit, data usang</td></tr><tr><td>Replika</td><td>Ketersediaan</td><td>Biaya operasional naik</td></tr><tr><td>Antarmuka stabil</td><td>Modifiability</td><td>Perlu disiplin kontrak</td></tr><tr><td>Outbox + worker</td><td>Notifikasi tak menggagalkan reservasi</td><td>Pengiriman asinkron/tertunda</td></tr></table></div>
<div class="card sc"><h3>Istilah yang sering tertukar</h3><table><tr><th>Pasangan</th><th>Bedanya</th></tr><tr><td>Top-down vs bottom-up</td><td>Dekomposisi dari tujuan vs komposisi dari aset yang ada</td></tr><tr><td>Iteratif vs inkremental</td><td>Memperbaiki vs menambah cakupan</td></tr><tr><td>Provided vs required interface</td><td>Ditawarkan vs dibutuhkan</td></tr><tr><td>Prasyarat vs pascasyarat vs invariant</td><td>Syarat sebelum, jaminan sesudah, aturan yang selalu benar</td></tr><tr><td>Batasan vs asumsi vs preferensi</td><td>Mutlak, perlu divalidasi, bisa didiskusikan</td></tr></table></div>
<div class="card"><h3>Pola jawaban cepat</h3><ul><li>Banyak tanggung jawab dalam satu unit → <b>SoC / kohesi rendah / SRP</b></li><li>Baca tabel modul lain → <b>coupling tinggi</b></li><li>Dua request bersamaan → <b>locking/constraint/atomic update</b>, bukan if biasa</li><li>Retry → <b>idempotensi (requestId)</b></li><li>Notifikasi eksternal → <b>outbox + worker, di luar transaksi</b></li><li>Kalimat “cepat/aman” → <b>skenario 6 unsur + angka</b></li></ul></div>`;
go("home");
</script>
</body>
</html>
